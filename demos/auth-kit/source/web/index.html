  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0F0E1F; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center;
      background: linear-gradient(135deg, #221A66, #5B47E0 55%, #8B6CFF); transition: opacity .3s; }
    #boot i { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.3);
      border-top-color: #fff; animation: s .8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot i { animation-duration: 3s; } }
  </style>
</head>
<body>
  <div id="boot" aria-label="Loading"><i></i></div>
  <noscript>This demo needs JavaScript. هذا العرض يحتاج تفعيل JavaScript.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) { b.style.opacity = '0'; setTimeout(function () { b.remove(); }, 320); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
